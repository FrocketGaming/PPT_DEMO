[project]
name = "deckgen"
version = "0.1.0"
description = "Config-driven PowerPoint generation: YAML decides what goes where, generic code draws it."
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
]

[project.scripts]
deckgen = "deckgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckgen"]
